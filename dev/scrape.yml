# VictoriaMetrics scrape config for local dev.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: auth
    static_configs: [{ targets: ["auth:8081"] }]
  - job_name: admin
    static_configs: [{ targets: ["admin:8081"] }]
  - job_name: quicvoiced
    static_configs: [{ targets: ["quicvoiced:8080"] }]
