# On every push to main: semantic-release reads the conventional commits since
# the last tag (feat → minor, fix/perf/refactor/build → patch). If there is a
# release, it tags vX.Y.Z, creates the GitHub release, and builds + pushes
# harbor.floret.dev/boson/admin:<version> and :latest (linux/amd64 + linux/arm64).
#
# Secrets: HARBOR_USERNAME / HARBOR_PASSWORD with push rights to the Harbor
# `boson` project (public, so anyone can pull).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  IMAGE: harbor.floret.dev/boson/admin

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui-stub
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: cd ui && npm ci --no-audit --no-fund && npm run check && npm run build

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.floret.dev
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/exec@6
          -p conventional-changelog-conventionalcommits@8
          semantic-release
